<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles/pharmacy.css">
    <script src="scripts/checkout.js" defer></script> 
</head>
<body>
    <h1>Checkout</h1>

    <!-- Cart Summary -->
    <section id="checkout-cart">
        <h2>Your Order</h2>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="checkout-items">
                <!-- Populated by checkout.js -->
            </tbody>
        </table>
        <p id="checkout-total">Total Price: $0</p>
    </section>

    <!-- Personal Details -->
    <section id="checkout-personal-details">
        <h2>Personal Details</h2>
        <form id="checkout-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Your Full Name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Your Email Address" required>
        </form>
    </section>

    <!-- Delivery Details -->
    <section id="checkout-delivery-details">
        <h2>Delivery Details</h2>
        <label for="address">Address:</label>
        <textarea id="address" placeholder="Delivery Address" required></textarea>

        <label for="city">City:</label>
        <input type="text" id="city" placeholder="City" required>

        <label for="postal-code">Postal Code:</label>
        <input type="text" id="postal-code" placeholder="Postal Code" required>
    </section>

    <!-- Payment Details -->
    <section id="checkout-payment-details">
        <h2>Payment Details</h2>
        <label for="card-number">Card Number:</label>
        <input type="text" id="card-number" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" required>

        <label for="expiry-date">Expiry Date:</label>
        <input type="month" id="expiry-date" required>

        <label for="cvv">CVV:</label>
        <input type="text" id="cvv" placeholder="123" maxlength="3" required>
    </section>

    <!-- Purchase Button -->
    <section id="checkout-actions">
        <button type="button" id="purchase-button">Purchase</button>
    </section>

    <footer>
        <p>&copy; 2024 Hospital Website. All rights reserved.</p>
    </footer>
</body>
</html>
